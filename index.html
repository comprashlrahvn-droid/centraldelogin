<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acesse o sistema | Vila Nova · Hospital Dr. Lauro Reus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --sa{syntax:'<percentage>';inherits:false;initial-value:0%}
:root{--a:#2fae62;--b:#e63946;--g1:#0a4d30;--g2:#1f8a4c;--g3:#4caf2a;--mut:#5b7066}
*{box-sizing:border-box;margin:0}
html{background:#eef2f5}
body{font-family:'Outfit',system-ui,sans-serif;color:var(--g1);min-height:100vh;position:relative;overflow-x:hidden;
  background:radial-gradient(900px 600px at 18% 8%,#fff,transparent 65%),radial-gradient(1000px 700px at 85% 90%,#dfe8ee,transparent 70%),linear-gradient(135deg,#f3f6f8,#e4ebf0)}
.blob{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
.blob.b1{width:520px;height:520px;background:#fff;left:-120px;top:20%;opacity:.8}
.blob.b2{width:460px;height:460px;background:color-mix(in srgb,var(--a) 22%,#fff);right:22%;top:-160px;opacity:.55;transition:background .8s;animation:deriva 24s ease-in-out infinite alternate}
@keyframes deriva{to{transform:translate(-80px,60px)}}
.stetho{position:fixed;left:0;bottom:9vh;width:min(48vw,720px);z-index:0;pointer-events:none;opacity:.95;
  -webkit-mask-image:linear-gradient(to right,#000 55%,transparent),linear-gradient(to bottom,transparent,#000 28%,#000 78%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,#000 55%,transparent),linear-gradient(to bottom,transparent,#000 28%,#000 78%,transparent);mask-composite:intersect}

/* luz: símbolo ao fundo, curvas laterais e curva do canto */
.fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.sw{position:fixed;right:0;bottom:0;width:clamp(300px,36vw,560px);z-index:1;pointer-events:none}
.a{--c:var(--a)}.b{--c:var(--b)}
.base{fill:none;stroke-linecap:round}
.arc{stroke:#fff;stroke-width:2.2;opacity:.95}.arc.sh{stroke:rgba(110,135,150,.22);stroke-width:3.6}
.ln{fill:none;stroke:var(--c);stroke-linecap:round;stroke-linejoin:round;opacity:.45;stroke-dasharray:1000;stroke-dashoffset:1000;animation:desenha 2.6s .3s cubic-bezier(.3,.7,.2,1) forwards;transition:stroke .8s}
@keyframes desenha{to{stroke-dashoffset:0}}
.cm{fill:none;stroke:var(--c,var(--a));stroke-linecap:round;stroke-dasharray:110 890;animation:fluxo var(--d,14s) linear infinite;transition:stroke .8s}
.cm.t{stroke-dasharray:26 974}
@keyframes fluxo{to{stroke-dashoffset:-1000}}
.sy.a{fill:url(#gA)}.sy.b{fill:url(#gB)}.sy{opacity:.17;animation:aparece 1.6s 1s both}
@keyframes aparece{from{opacity:0}}
.pt{fill:#fff;stroke:var(--c,var(--a));stroke-width:1.2}
.shape{transform-box:fill-box;transform-origin:center;animation:flutua 34s ease-in-out infinite alternate}
@keyframes flutua{to{transform:translateY(-10px) rotate(3deg) scale(1.025)}}
#fxs{transition:transform .9s ease-out}

.page{position:relative;z-index:2;min-height:100vh;max-width:1560px;margin:0 auto;padding:44px clamp(24px,6vw,96px);display:grid;grid-template-columns:minmax(0,1fr) clamp(430px,38vw,600px);gap:clamp(24px,4vw,70px);align-items:center}
.left{align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;gap:30px;min-height:calc(100vh - 88px)}
.brand{display:flex;align-items:center;gap:26px;animation:sobe .9s both}
.brand img{height:auto;display:block}.brand .vn{width:clamp(110px,10.5vw,170px)}.brand .lr{width:clamp(170px,16vw,270px)}
.brand i{width:1px;align-self:stretch;min-height:96px;background:rgba(10,77,48,.22)}
.hero{animation:sobe .9s .12s both}
h1{font-size:clamp(3.8rem,8vw,7.4rem);font-weight:800;letter-spacing:-.035em;line-height:1;color:color-mix(in srgb,var(--a) 38%,#082a1b);transition:color .8s}
h1 .lt{color:var(--a);background:linear-gradient(95deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-right:.05em}
.lead{font-size:clamp(1.3rem,2.5vw,2.3rem);font-weight:300;margin-top:8px;color:#1e4a38}
.lead b{font-weight:700;color:color-mix(in srgb,var(--a) 38%,#082a1b);transition:color .8s}
.bar{position:relative;display:block;width:156px;height:4px;border-radius:4px;margin-top:30px;background:linear-gradient(90deg,#d62839 0 50%,#2f9e44 50%)}
.bar::after{content:"";position:absolute;top:50%;left:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:#fff;border:2px solid var(--a);box-shadow:0 0 10px 3px var(--a);animation:corre 3.4s ease-in-out infinite alternate;transition:border-color .8s,box-shadow .8s}
@keyframes corre{to{left:100%}}
.tag{border-left:4px solid var(--g2);padding-left:18px;font-size:.95rem;letter-spacing:.34em;font-weight:500;color:#20384a;animation:sobe .9s .3s both}
@keyframes sobe{from{opacity:0;transform:translateY(22px)}}

/* cartão */
.card{position:relative;border-radius:36px;padding:26px 28px 20px;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);box-shadow:0 30px 80px -30px rgba(40,70,90,.35),0 2px 0 rgba(255,255,255,.9) inset;animation:entra 1s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes entra{from{opacity:0;transform:translateX(40px) scale(.97)}}
.luz::after,.luz::before{content:"";position:absolute;border-radius:inherit;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0 84%,color-mix(in srgb,var(--a) 45%,transparent) 94%,var(--a) 99.4%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  animation:gira var(--dur,7s) linear infinite;animation-delay:var(--dl,0s);transition:opacity .3s}
.luz::after{inset:0;padding:1.6px}
.luz::before{inset:-3px;padding:6px;filter:blur(4px);opacity:.9}
@keyframes gira{to{--ang:360deg}}
.head{display:flex;align-items:center;gap:16px;padding-bottom:20px;border-bottom:1px solid rgba(10,77,48,.12)}
.ico{flex:none;width:46px;height:46px;fill:none;stroke:var(--g2);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.head h2{font-size:1.5rem;font-weight:700;line-height:1.1}
.head p{font-size:.9rem;color:var(--mut);margin-top:3px;line-height:1.3}
.rib{margin-left:auto;flex:none;width:50px;height:60px;padding-left:16px;border-left:1px solid rgba(10,77,48,.14);box-sizing:content-box;color:var(--a);filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--a) 45%,transparent));animation:pulsa 4s ease-in-out infinite;transition:color .8s}
.rib svg{width:100%;height:100%;fill:currentColor}
@keyframes pulsa{50%{transform:translateY(-3px) rotate(-4deg)}}
.acc{display:flex;gap:14px;align-items:center;margin:20px 0 16px}
.acc .ico{width:30px;height:30px;stroke-width:2.2}
.acc h3{font-size:1.35rem;font-weight:700}.acc p{font-size:.95rem;color:var(--mut);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.tile{--mx:50%;--my:50%;--sa:0%;--dur:7s;position:relative;grid-column:span 2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:112px;padding:14px 10px;border-radius:22px;text-align:center;text-decoration:none;color:var(--g1);
  background:radial-gradient(200px circle at var(--mx) var(--my),color-mix(in srgb,var(--a) var(--sa),transparent),transparent 70%),linear-gradient(#fff,#f6f9f9);
  border:1px solid rgba(10,77,48,.09);box-shadow:0 8px 22px -12px rgba(40,70,90,.35);transition:transform .2s,box-shadow .3s,--sa .3s,border-color .3s;
  animation:entra .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*80ms + 450ms);--dl:calc(var(--i)*-1.3s)}
.tile.w6{grid-column:span 6;flex-direction:row;gap:18px;min-height:84px;justify-content:flex-start;padding:14px 22px;text-align:left}
.tile.w3{grid-column:span 3}
.tile:hover,.tile:focus-visible{--sa:16%;transform:perspective(800px) translateY(-5px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));border-color:color-mix(in srgb,var(--a) 55%,transparent);box-shadow:0 18px 36px -14px var(--a);outline:none}
.tile:hover.luz::before,.tile:focus-visible.luz::before{opacity:1}
.ch{flex:none;width:58px;height:58px;border-radius:19px;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--ch,var(--g2)) 20%,#fff),color-mix(in srgb,var(--ch,var(--g2)) 7%,#fff));border:1px solid color-mix(in srgb,var(--ch,var(--g2)) 24%,transparent);box-shadow:0 10px 18px -9px color-mix(in srgb,var(--ch,var(--g2)) 60%,transparent),inset 0 1px 0 #fff;transition:.35s cubic-bezier(.2,.8,.2,1)}
.tile.w6 .ch{width:54px;height:54px}
.ti{width:31px;height:31px;fill:none;stroke:var(--ch,var(--g2));stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;transition:.3s}
.ti .d{fill:color-mix(in srgb,var(--ch,var(--g2)) 24%,transparent)}.ti .f{fill:#fff}
.tile:hover .ch{background:linear-gradient(145deg,var(--ch),color-mix(in srgb,var(--ch) 68%,#000));transform:translateY(-3px) rotate(-5deg) scale(1.05);box-shadow:0 14px 24px -8px var(--ch);border-color:transparent}
.tile:hover .ti{stroke:#fff}.tile:hover .ti .d{fill:rgba(255,255,255,.3)}.tile:hover .ti .f{fill:var(--ch)}
.ico .d{fill:color-mix(in srgb,var(--g2) 15%,transparent)}
.dt{position:relative;display:flex;align-items:center;gap:14px;margin-top:26px;padding:12px 22px 12px 16px;width:fit-content;border-radius:22px;background:rgba(255,255,255,.58);backdrop-filter:blur(10px);border:1px solid rgba(10,77,48,.09);box-shadow:0 12px 30px -16px rgba(40,70,90,.4);animation:sobe .9s .24s both}
.dt .ico{width:38px;height:38px;stroke:color-mix(in srgb,var(--a) 65%,#0a3322);transition:stroke .8s}
.dt .ico .d{fill:color-mix(in srgb,var(--a) 20%,transparent)}
.dt b{display:block;font-size:2rem;font-weight:700;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--g1)}
.dt b small{font-size:.95rem;font-weight:500;color:var(--mut);margin-left:3px}
.dt .cl{animation:pisca 1s steps(1,end) infinite}
@keyframes pisca{50%{opacity:.25}}
#data{display:block;font-size:.95rem;color:var(--mut);margin-top:6px}
.tile span.n{font-size:.95rem;font-weight:600;line-height:1.2}
.tile.w6 span.n{font-size:1.02rem}
.key{position:absolute;right:12px;top:9px;font-size:.68rem;color:var(--mut);opacity:0;transition:.3s}
.tile:hover .key{opacity:.8}
.rec i.dot{position:absolute;left:12px;top:12px;width:9px;height:9px;border-radius:50%;background:var(--b);box-shadow:0 0 9px var(--b);animation:pulsa2 2s infinite}
@keyframes pulsa2{50%{transform:scale(1.5);opacity:.6}}
.sec{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(10,77,48,.12);font-size:.95rem;color:var(--g1)}
.sec .ico{width:20px;height:20px;stroke-width:2.4}

.tema{position:fixed;top:14px;right:16px;z-index:6;font-size:.8rem;color:var(--mut);display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border:1px solid rgba(10,77,48,.12);border-radius:12px;padding:5px 10px}
.tema select{font:inherit;color:var(--g1);background:none;border:0;outline:none;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:#0a4d30;color:#fff;padding:12px 20px;border-radius:14px;font-size:.9rem;transition:transform .35s;z-index:9;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.on{transform:translate(-50%,0)}
@media (max-width:1000px){.page{grid-template-columns:1fr;padding-top:60px}.left{min-height:0}.hero{margin:10px 0 6px}.card{max-width:640px;width:100%;margin:0 auto}.tag{font-size:.8rem}.stetho{opacity:.5}}
@media (max-width:560px){.tile{grid-column:span 3}.tile.w6,.tile:nth-child(6){grid-column:span 6}.brand .vn{width:92px}.brand .lr{width:150px}.card{padding:20px 16px 16px;border-radius:28px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ln{stroke-dashoffset:0}}
</style>
</head>

const NS='http://www.w3.org/2000/svg';
const mk=(t,at,st)=>{const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);if(st)e.style.cssText=st;return e;};
const reduz=matchMedia('(prefers-reduced-motion: reduce)').matches;
function suave(P){
  const n=P.length,f=v=>v.toFixed(1); let d='M'+P[0][0]+' '+P[0][1];
  for(let i=0;i<n;i++){const p0=P[(i+n-1)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    d+='C'+f(p1[0]+(p2[0]-p0[0])/6)+' '+f(p1[1]+(p2[1]-p0[1])/6)+' '+f(p2[0]-(p3[0]-p1[0])/6)+' '+f(p2[1]-(p3[1]-p1[1])/6)+' '+p2[0]+' '+p2[1];}
  return d+'Z';
}
/* cometa + pontos de luz correndo por um caminho */
function luz(g,d,cor,w,k,pts){
  const glow=mk('g',{filter:'url(#glow)'});
  const c1=mk('path',{d,pathLength:1000,class:'cm '+cor},`--d:${12+k*3}s;animation-delay:${-k*4}s;stroke-width:${w*2.2}`);
  const c2=mk('path',{d,pathLength:1000,class:'cm t '+cor},`--d:${8+k*2}s;animation-delay:${-k*3-2}s;stroke-width:${w*1.5}`);
  glow.append(c1,c2);
  if(!reduz) for(let i=0;i<pts;i++){
    const p=mk('circle',{r:w*1.9,class:'pt '+cor}), a=mk('animateMotion',{dur:(11+i*4+k)+'s',begin:'-'+(i*4.1+k)+'s',repeatCount:'indefinite',path:d});
    p.appendChild(a); glow.appendChild(p);
  }
  g.appendChild(glow);
}
/* símbolo da Vila Nova grande ao fundo, atrás do cartão */
(function(){
  const esc=1.2, w=v=>(v/esc);
  const o=mk('g',{transform:`translate(800 410) scale(${esc})`}), sh=mk('g',{class:'shape'});
  VN.forEach((f,i)=>{
    const d=suave(f.p), c=f.c;
    sh.appendChild(mk('path',{d,class:'sy '+c}));
    sh.appendChild(mk('path',{d,pathLength:1000,class:'ln '+c},`stroke-width:${w(1.8)}`));
    luz(sh,d,c,w(1.6),i,2);
  });
  o.appendChild(sh); $('simb').appendChild(o);
})();
/* curvas laterais */
const ARCOS=[
  {d:'M300 -40C110 130 20 360 70 560S190 830 380 940',c:'a'},
  {d:'M110 -40C-30 110 -70 300 -40 450',c:'b'},
  {d:'M1290 -30C1410 30 1480 200 1450 340',c:'a'},
  {d:'M1480 520C1420 640 1290 730 1130 790',c:'b'},
  {d:'M640 960C780 900 870 820 940 700',c:'a'}
];
ARCOS.forEach((r,i)=>{
  const g=$('arcos');
  g.appendChild(mk('path',{d:r.d,class:'base arc sh',transform:'translate(2 3)'}));
  g.appendChild(mk('path',{d:r.d,class:'base arc'}));
  luz(g,r.d,r.c,1.5,i,1);
});
/* curva vermelha/verde do canto inferior direito */
luz($('swl'),'M0 190C160 140 360 50 600 0',"a",1.3,1,1);
luz($('swl'),'M150 190C300 132 450 92 600 54',"b",1.3,2,1);
addEventListener('pointermove',e=>{
  $('fxs').style.transform=`translate(${(.5-e.clientX/innerWidth)*26}px,${(.5-e.clientY/innerHeight)*26}px)`;
});

/* ---------- seletor de tema ---------- */
const sel=$('tema');
sel.innerHTML='<option value="auto">Automático (mês atual)</option><option value="inst">Institucional</option>'+MESES.map((m,i)=>`<option value="${i}">${m.nome}</option>`).join('');
let salvo='auto'; try{salvo=localStorage.getItem('tema')||'auto';}catch(e){}
sel.value=salvo;
sel.addEventListener('change',()=>{try{localStorage.setItem('tema',sel.value);}catch(e){} aplicarTema(escolher(sel.value));});
aplicarTema(escolher(salvo));
