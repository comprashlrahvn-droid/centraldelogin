<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Sistemas | Vila Nova · Hospital Dr. Lauro Reus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --sa{syntax:'<percentage>';inherits:false;initial-value:0%}
:root{--a:#1f6fd0;--b:#5aa9ff;--s1:hsl(205 62% 54%);--s2:hsl(210 85% 83%);--s3:hsl(224 70% 90%);--s4:hsl(172 55% 55%);--ink:#0b2a4a;--mut:#46647a}
*{box-sizing:border-box;margin:0}
html{background:#cfe6f7}
body{font-family:'Outfit',system-ui,sans-serif;color:var(--ink);min-height:100vh;position:relative;overflow-x:hidden;
  background:
    radial-gradient(1000px 460px at 58% 0%,var(--s1),transparent 72%),
    radial-gradient(560px 700px at 100% 40%,var(--s4),transparent 72%),
    radial-gradient(1000px 650px at 0% 0%,var(--s3),transparent 68%),
    radial-gradient(1000px 520px at 16% 108%,rgba(255,217,172,.95),transparent 70%),
    radial-gradient(900px 480px at 66% 100%,color-mix(in srgb,var(--s2) 85%,transparent),transparent 72%),
    linear-gradient(170deg,color-mix(in srgb,var(--s2) 85%,#fff) 0%,color-mix(in srgb,var(--s2) 55%,#fff) 55%,#fff0dc 100%)}
.orbe{pointer-events:none}
.foto{position:fixed;left:0;bottom:0;width:min(50vw,860px);z-index:0;pointer-events:none;user-select:none}

/* luz: símbolo, curvas, brilhos */
.fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#fxs{transition:transform .9s ease-out}
.a{--c:var(--a)}.b{--c:var(--b)}.w{--c:#fff}
.ln{fill:none;stroke:var(--c);stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:desenha 2.6s .3s cubic-bezier(.3,.7,.2,1) forwards;transition:stroke .8s}
@keyframes desenha{to{stroke-dashoffset:0}}
.cm{fill:none;stroke:var(--c,var(--a));stroke-linecap:round;stroke-dasharray:80 920;opacity:.62;animation:fluxo var(--d,18s) linear infinite;transition:stroke .8s}
.cm.g{opacity:.13}
@keyframes fluxo{to{stroke-dashoffset:-1000}}
.pt{fill:#fff;stroke:var(--c,var(--a));stroke-width:1;opacity:.8}
.sy{fill:rgba(255,255,255,.13)}
.sym .ln{stroke:#fff;opacity:.55}

.top{position:absolute;top:26px;right:clamp(20px,5vw,90px);display:flex;gap:14px;align-items:center;z-index:8}
.bell{position:relative;width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(255,255,255,.9);background:rgba(255,255,255,.72);backdrop-filter:blur(12px);display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 26px -14px var(--a);transition:.3s}
.bell:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px var(--a)}
.bell svg{width:24px;height:24px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bell i{position:absolute;top:10px;right:11px;width:11px;height:11px;border-radius:50%;background:#e63946;border:2px solid #fff;}
.pop{position:absolute;top:64px;right:0;width:300px;padding:16px 18px;border-radius:22px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);box-shadow:0 24px 50px -20px rgba(10,40,70,.5);opacity:0;transform:translateY(-8px);pointer-events:none;transition:.25s}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.pop small{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:600}
.pop h4{font-size:1.15rem;margin:4px 0 2px;color:color-mix(in srgb,var(--a) 80%,#001)}.pop p{font-size:.9rem;color:var(--mut);line-height:1.4}
.pill{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px 0 7px;border-radius:999px;border:1.5px solid rgba(255,255,255,.9);background:rgba(255,255,255,.72);backdrop-filter:blur(12px);box-shadow:0 10px 26px -14px var(--a);font-size:.95rem;color:var(--ink)}
.pill .av{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 10px -4px rgba(0,0,0,.25)}
.pill .av svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pill select{appearance:none;-webkit-appearance:none;font:inherit;color:inherit;background:none;border:0;outline:none;cursor:pointer;padding-right:4px;max-width:200px}
.pill .cv2{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.page{position:relative;z-index:2;min-height:100vh;max-width:1700px;margin:0 auto;padding:30px clamp(24px,5vw,90px) 40px clamp(24px,7.8vw,150px);display:grid;grid-template-columns:minmax(0,1fr) clamp(540px,50vw,860px);gap:clamp(24px,3vw,56px);align-items:center}
.left{align-self:start;display:flex;flex-direction:column;gap:clamp(14px,1.9vh,22px)}
.left>div:nth-child(2){margin-left:clamp(0px,3vw,50px)}.camp,.dt{margin-left:clamp(0px,9vw,150px)}
.left>*{animation:sobe .9s backwards}.left>*:nth-child(2){animation-delay:.08s}.left>*:nth-child(3){animation-delay:.16s}.left>*:nth-child(4){animation-delay:.24s}
@keyframes sobe{from{opacity:0;transform:translateY(22px)}}
.brand{display:flex;align-items:center;gap:26px}
.brand img{height:auto;display:block}.brand .vn{width:clamp(110px,10.2vw,168px)}.brand .lr{width:clamp(170px,15.5vw,262px)}
.brand i{width:1px;align-self:stretch;min-height:96px;background:rgba(11,42,74,.25)}
.hi{font-size:1.25rem;font-weight:600;width:fit-content;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px}
.t1{display:block;font-size:clamp(2.6rem,3.9vw,4rem);font-weight:300;letter-spacing:-.02em;line-height:1;color:color-mix(in srgb,var(--a) 26%,#0a2f3f);transition:color .8s}
.t2{display:block;font-size:clamp(3.2rem,5.1vw,5.3rem);font-weight:800;letter-spacing:-.03em;line-height:1.02;background:linear-gradient(100deg,#08562b,#1f9a4d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-bottom:.04em}
.bar{position:relative;display:flex;gap:9px;width:fit-content;margin-top:16px}
.bar b{display:block;width:62px;height:4px;border-radius:4px}.bar .g{background:#1f9a4d}.bar .r{background:#e63946}
.bar::after{content:"";position:absolute;top:50%;left:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;border:2px solid var(--a);box-shadow:0 0 6px 1px var(--a);opacity:.85;animation:corre 6s ease-in-out infinite alternate}
@keyframes corre{to{left:100%}}
.tag{margin-top:14px;font-size:clamp(1rem,1.3vw,1.3rem);line-height:1.4;max-width:24em;color:color-mix(in srgb,var(--a) 18%,#143b4d)}.tag b{font-weight:700}

.luz{position:relative}
.rg{position:absolute;inset:0;border-radius:inherit;padding:1.4px;pointer-events:none;overflow:hidden;opacity:.7;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.rg i{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;background:conic-gradient(transparent 0 90%,color-mix(in srgb,var(--a) 38%,transparent) 96%,color-mix(in srgb,var(--a) 80%,#fff) 100%);animation:rot var(--dur,12s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes rot{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
.camp{display:flex;gap:16px;align-items:center;width:fit-content;max-width:100%;padding:14px 30px 14px 22px;border-radius:38px;background:rgba(255,255,255,.62);border:1.5px solid rgba(255,255,255,.95);box-shadow:0 16px 36px -22px var(--a),inset 0 0 22px rgba(255,255,255,.6)}
.camp svg{flex:none;width:54px;height:68px;color:var(--a);fill:currentColor;filter:drop-shadow(0 4px 6px color-mix(in srgb,var(--a) 30%,transparent));transition:color .8s}
.camp i{width:1px;height:50px;background:rgba(11,42,74,.2)}
.camp h2{font-size:1.5rem;font-weight:700;line-height:1.1;color:color-mix(in srgb,var(--a) 86%,#001);transition:color .8s}
.camp p{font-size:.95rem;color:var(--mut);margin-top:3px;line-height:1.3;max-width:19em}
.dt{display:flex;align-items:center;gap:16px;width:fit-content;padding:12px 38px 12px 22px;border-radius:38px;background:rgba(255,255,255,.62);border:1.5px solid color-mix(in srgb,var(--a) 62%,#fff);box-shadow:0 0 0 2px rgba(255,255,255,.6),0 0 20px 1px color-mix(in srgb,var(--a) 42%,transparent),inset 0 0 22px rgba(255,255,255,.6)}
.dt .ico{width:42px;height:42px;fill:none;stroke:color-mix(in srgb,var(--a) 40%,#0b2a4a);stroke-width:1.9;stroke-linecap:round;transition:stroke .8s}
.dt .ico .d{fill:color-mix(in srgb,var(--a) 14%,transparent)}
.dt b{display:block;font-size:2.15rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.dt b small{font-size:.95rem;font-weight:500;color:var(--mut);margin-left:3px;position:relative;top:-.55em}
.dt .cl{animation:pisca 2s ease-in-out infinite}
@keyframes pisca{50%{opacity:.45}}
#data{display:block;font-size:.98rem;color:var(--mut);margin-top:5px;white-space:nowrap}

/* cartão de vidro */
.card{position:relative;border-radius:clamp(44px,5.4vw,88px);padding:clamp(24px,2.5vw,38px) clamp(22px,3vw,48px) clamp(18px,2vw,28px);
  background:linear-gradient(135deg,rgba(255,255,255,.64),rgba(255,255,255,.3));backdrop-filter:blur(16px);isolation:isolate;transform:translateZ(0);backface-visibility:hidden;border:1.6px solid rgba(255,255,255,.9);
  box-shadow:0 40px 90px -34px color-mix(in srgb,var(--a) 60%,transparent),0 0 0 8px rgba(255,255,255,.14),0 0 34px 2px color-mix(in srgb,var(--a) 24%,rgba(255,255,255,.65)),inset 0 2px 0 rgba(255,255,255,.95),inset 0 0 44px rgba(255,255,255,.4);animation:entra 1s .2s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes entra{from{opacity:0;transform:translateX(40px) scale(.97)}}
.hd{display:flex;align-items:center;gap:clamp(14px,1.6vw,22px);padding-bottom:clamp(16px,2vw,24px);border-bottom:1.5px solid rgba(255,255,255,.75)}
.mon{flex:none;width:clamp(46px,4.4vw,66px);height:auto;fill:none;stroke:color-mix(in srgb,var(--a) 30%,#0c2540);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:stroke .8s}
.hd h2{font-size:clamp(1.6rem,2.7vw,2.55rem);font-weight:700;line-height:1.05;letter-spacing:-.01em;color:color-mix(in srgb,var(--a) 34%,#0b2a4a);transition:color .8s}
.hd p{font-size:clamp(.88rem,1.12vw,1.08rem);color:var(--mut);margin-top:6px}
.shield{margin-left:auto;flex:none;width:clamp(56px,5vw,78px);height:clamp(56px,5vw,78px);border-radius:26px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(214,244,226,.85));border:1.5px solid #fff;box-shadow:0 14px 28px -14px #1f9a4d}
.shield svg{width:56%;height:56%;fill:rgba(31,154,77,.14);stroke:#1f8a4c;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.1vw,16px);margin:clamp(16px,1.8vw,24px) 0}
.tile .rg{opacity:.4;transition:opacity .3s}.tile:hover .rg{opacity:1}
.tile{--ch:#1f6fd0;--ink2:color-mix(in srgb,var(--ch) 80%,#001);--mx:50%;--my:50%;--sa:0%;--dur:8s;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1vw,14px);min-height:clamp(130px,11.6vw,178px);padding:16px 12px;border-radius:28px;text-align:center;text-decoration:none;color:var(--ink2);
  border:2px solid transparent;
  background:
    radial-gradient(190px circle at var(--mx) var(--my),color-mix(in srgb,var(--ch) var(--sa),transparent),transparent 70%) padding-box,
    linear-gradient(150deg,color-mix(in srgb,var(--ch) 24%,#fff),color-mix(in srgb,var(--ch) 8%,#fff) 70%,color-mix(in srgb,var(--ch) 15%,#fff)) padding-box,
    linear-gradient(135deg,var(--ch) 0,color-mix(in srgb,var(--ch) 30%,transparent) 26%,rgba(255,255,255,.75) 60%) border-box;
  box-shadow:0 16px 28px -18px var(--ch),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .22s,box-shadow .3s,--sa .3s;
  animation:entra .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*80ms + 450ms);--dl:calc(var(--i)*-1.3s)}
.tile:hover,.tile:focus-visible{--sa:20%;transform:perspective(800px) translateY(-6px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));box-shadow:0 24px 40px -16px var(--ch);outline:none}
.ti{width:clamp(44px,4.3vw,62px);height:auto;fill:none;stroke:var(--ch);stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 7px 8px color-mix(in srgb,var(--ch) 32%,transparent));transition:.35s cubic-bezier(.2,.8,.2,1)}
.ti .d{fill:color-mix(in srgb,var(--ch) 22%,transparent)}.ti .f{fill:#fff}
.tile:hover .ti{transform:translateY(-3px) scale(1.12) rotate(-3deg)}
.n{font-size:clamp(.88rem,1.12vw,1.08rem);font-weight:700;line-height:1.18}
.key{position:absolute;right:14px;top:10px;font-size:.7rem;font-weight:600;color:var(--ink2);opacity:0;transition:.3s}.tile:hover .key{opacity:.7}
.rec i.dot{position:absolute;left:14px;top:14px;width:9px;height:9px;border-radius:50%;background:#e63946;box-shadow:0 0 6px #e63946}
.sec{display:flex;justify-content:center;align-items:center;gap:14px;padding-top:clamp(12px,1.4vw,20px);border-top:1.5px solid rgba(255,255,255,.75);font-size:clamp(1rem,1.3vw,1.25rem);color:var(--ink)}
.sec svg{width:clamp(26px,2.4vw,36px);height:auto;fill:rgba(31,154,77,.14);stroke:#1f8a4c;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140px);background:#0b2a4a;color:#fff;padding:12px 20px;border-radius:14px;font-size:.9rem;transition:transform .35s;z-index:9;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.on{transform:translate(-50%,0)}
@media (max-width:1100px){.page{grid-template-columns:1fr;padding:96px clamp(20px,5vw,60px) 40px}.left>div:nth-child(2),.camp,.dt{margin-left:0}.card{max-width:760px;width:100%;margin:0 auto}.foto{opacity:.55}}
@media (max-width:620px){.grid{grid-template-columns:1fr 1fr}.tile:nth-child(odd):last-child{grid-column:span 2}.brand .vn{width:92px}.brand .lr{width:150px}.card{padding:22px 16px 16px;border-radius:38px}.pill select{max-width:130px}.camp,.dt{padding-right:22px}#data{white-space:normal}.camp i{display:none}.t1{font-size:3rem}.t2{font-size:3.6rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ln{stroke-dashoffset:0}}
</style>
</head>

function hsl(hex){
  const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn; let h=0;
  if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360;}
  const l=(mx+mn)/2,s=d?d/(1-Math.abs(2*l-1)):0; return [h,s*100,l*100];
}
